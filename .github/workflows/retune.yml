name: Quarterly retune

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *"   # 9:00 UTC on Jan 1, Apr 1, Jul 1 and Oct 1
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update        # never runs at the same time as a prediction update
  cancel-in-progress: false

jobs:
  retune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-pick model settings from every finished game
        run: python -m sportsai.retune
      - name: Save new settings
        run: |
          git config user.name "sports-ai-bot"
          git config user.email "sports-ai-bot@users.noreply.github.com"
          git add data/backtest_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Quarterly retune"
            git pull --rebase origin main && git push origin HEAD:main
          fi
