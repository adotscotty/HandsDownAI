name: Update predictions

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub sometimes runs these a few minutes late)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always start from the newest saved data, not the commit that triggered the run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make predictions (latest scores, injuries and odds from ESPN)
        run: python -m sportsai.predict

      - name: Save ESPN power index (once a day, for later testing)
        run: python -m sportsai.powerindex || true

      - name: Build website data
        run: python -m sportsai.build_site

      - name: Save finished games and pre-game picks
        if: always()   # save locked picks even if a later step breaks, so no picks are lost
        run: |
          git config user.name "sports-ai-bot"
          git config user.email "sports-ai-bot@users.noreply.github.com"
          git add data/current_*.csv data/season_*.csv data/pregame_log.csv data/parlays_log.csv data/props_log.csv data/players_*.csv data/bestbets_log.csv data/powerindex
          if ! git diff --cached --quiet; then
            git commit -m "Update finished games"
            git pull --rebase -X theirs origin main && git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
