name: Update predictions

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub sometimes runs these a few minutes late)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  # GitHub only starts this about every 40-60 minutes (it often skips 15-minute schedules), so each
  # start refreshes the site five times, about 13 minutes apart (~55 minutes in all). The next start
  # waits its turn and begins right after, so the site keeps updating with no long gaps.
  pass1:
    uses: ./.github/workflows/refresh.yml
    with: { pass: 1, wait_minutes: 0 }
  pass2:
    needs: pass1
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/refresh.yml
    with: { pass: 2, wait_minutes: 12 }
  pass3:
    needs: pass2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/refresh.yml
    with: { pass: 3, wait_minutes: 12 }
  pass4:
    needs: pass3
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/refresh.yml
    with: { pass: 4, wait_minutes: 12 }
  pass5:
    needs: pass4
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/refresh.yml
    with: { pass: 5, wait_minutes: 12 }
