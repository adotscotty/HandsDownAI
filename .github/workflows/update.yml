name: Update predictions

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub sometimes runs these a few minutes late)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  # GitHub only starts this about every 40 minutes, so each start refreshes the site three times,
  # about 13 minutes apart. That keeps picks fresh right up to the 25-minute lock.
  pass1:
    uses: ./.github/workflows/refresh.yml
    with: { pass: 1, wait_minutes: 0 }
  pass2:
    needs: pass1
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/refresh.yml
    with: { pass: 2, wait_minutes: 12 }
  pass3:
    needs: pass2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/refresh.yml
    with: { pass: 3, wait_minutes: 12 }
